name: Build H5000M initramfs

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Firmware profile to build
        required: true
        default: both
        type: choice
        options:
          - both
          - rescue
          - full

jobs:
  build:
    name: build-${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profile == 'both' && '["rescue","full"]' || format('["{0}"]', inputs.profile)) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: openwrt-25.12

      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo rm -rf /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker system prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Install minimal build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib gettext git libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libncurses-dev libreadline-dev libssl-dev libtool ninja-build p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Add QModem feed
        run: |
          echo 'src-git qmodem https://github.com/FUjr/QModem.git;main' >> feeds.conf.default

      - name: Add H5000M feature sources
        if: matrix.profile == 'full'
        run: |
          git clone --depth=1 https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter
          git clone --depth=1 https://github.com/brvphoenix/wrtbwmon.git /tmp/wrtbwmon-src
          git clone --depth=1 https://github.com/brvphoenix/luci-app-wrtbwmon.git /tmp/luci-wrtbwmon-src
          cp -a /tmp/wrtbwmon-src/wrtbwmon package/wrtbwmon
          cp -a /tmp/luci-wrtbwmon-src/luci-app-wrtbwmon package/luci-app-wrtbwmon

      - name: Apply private H5000M overlay
        run: |
          rm -rf /tmp/h5000m-overlay
          mkdir -p /tmp/h5000m-overlay package/hiveton
          unzip -q h5000m-25.12-build-overlay.zip -d /tmp/h5000m-overlay
          cp -a /tmp/h5000m-overlay/higoros package/hiveton/higoros
          cp /tmp/h5000m-overlay/h5000m-initramfs.config .config
          sed -i 's|PROG=/usr/sbin/higorosd|PROG=/usr/bin/higorosd|' package/hiveton/higoros/files/etc/init.d/higoros
          mkdir -p package/hiveton/higoros/files/etc/uci-defaults
          printf '%s' '' | base64 -d > package/hiveton/higoros/files/etc/uci-defaults/96-h5000m-qmodem-redial
          printf '%s' '' | base64 -d > package/hiveton/higoros/files/etc/uci-defaults/97-h5000m-wireless
          printf '%s' '' | base64 -d > package/hiveton/higoros/files/etc/uci-defaults/98-h5000m-network
          printf '%s' '' | base64 -d > package/hiveton/higoros/files/etc/uci-defaults/99-h5000m-qmodem
          printf '%s' '' | base64 -d > package/hiveton/higoros/Makefile

          # Higo probes for a package named "fancontrol".  Reimplement the small
          # vendor daemon as a portable procd shell service against pwm-fan sysfs.
          mkdir -p package/hiveton/fancontrol/files/etc/init.d package/hiveton/fancontrol/files/etc/config package/hiveton/fancontrol/files/usr/bin
          printf '%s' '' | base64 -d > package/hiveton/fancontrol/Makefile
          cat > package/hiveton/fancontrol/files/etc/config/fancontrol <<'EOF'
          config fancontrol 'settings'
                  option enable '1'
                  option thermal_file '/sys/class/thermal/thermal_zone0/temp'
                  option fan_file '/sys/class/hwmon/hwmon2/pwm1'
                  option start_temp '45'
                  option start_speed '35'
                  option max_speed '255'
                  option temp_div '1000'
                  option mode '1'
                  option curve_silent '20:0,25:0,30:0,35:0,40:0,45:0,50:0,55:16,60:19,65:22,70:25,75:28,80:31,85:35,90:38,95:41,100:44,105:47,110:50'
                  option curve_balanced '20:0,25:0,30:0,35:0,40:0,45:27,50:33,55:38,60:44,65:49,70:55,75:60,80:65,85:71,90:76,95:82,100:87,105:94,110:100'
                  option curve_performance '20:0,25:0,30:78,35:81,40:83,45:86,50:88,55:90,60:93,65:95,70:97,75:100,80:100,85:100,90:100,95:100,100:100,105:100,110:100'
          EOF
          cat > package/hiveton/fancontrol/files/etc/init.d/fancontrol <<'EOF'
          #!/bin/sh /etc/rc.common
          START=99
          STOP=01
          USE_PROCD=1
          start_service() {
                  config_load fancontrol
                  local enable mode
                  config_get_bool enable settings enable 1
                  config_get mode settings mode 1
                  [ "$enable" = 1 ] || return 0
                  procd_open_instance
                  procd_set_param command /usr/bin/fancontrol "$mode"
                  procd_set_param respawn 5 10 0
                  procd_close_instance
          }
          service_triggers() { procd_add_reload_trigger fancontrol; }
          EOF
          cat > package/hiveton/fancontrol/files/usr/bin/fancontrol <<'EOF'
          #!/bin/sh
          mode="${1:-1}"
          while :; do
                  thermal="$(uci -q get fancontrol.settings.thermal_file)"
                  pwm="$(uci -q get fancontrol.settings.fan_file)"
                  [ -r "$thermal" ] || thermal="$(find /sys/class/thermal -name temp 2>/dev/null | head -n1)"
                  [ -w "$pwm" ] || pwm="$(find /sys/class/hwmon -name pwm1 2>/dev/null | head -n1)"
                  temp="$(cat "$thermal" 2>/dev/null)"; temp=$(( ${temp:-0} / 1000 ))
                  case "$mode" in 0) curve=curve_silent;; 2) curve=curve_performance;; *) curve=curve_balanced;; esac
                  points="$(uci -q get fancontrol.settings.$curve)"; percent=0
                  oldifs="$IFS"; IFS=,
                  for point in $points; do threshold="${point%%:*}"; value="${point#*:}"; [ "$temp" -ge "$threshold" ] && percent="$value"; done
                  IFS="$oldifs"; max="$(uci -q get fancontrol.settings.max_speed)"; max="${max:-255}"
                  [ -n "$pwm" ] && printf '%s\n' $(( percent * max / 100 )) > "$pwm" 2>/dev/null
                  sleep 5
          done
          EOF
          rm -rf /tmp/h5000m-overlay

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply H5000M runtime fixes
        run: |
          # QModem starts modem_scand before it checks block_auto_probe.  Keep the
          # fixed RG520N-CN path but suppress the redundant generic scanner.
          QMODEM_INIT="$(find feeds package -path '*/qmodem/files/etc/init.d/qmodem_init' -print -quit)"
          test -n "$QMODEM_INIT"
          python3 - "$QMODEM_INIT" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_text()
          old = '''        config_load qmodem
              _start_scand
              config_foreach _mk_rundir modem-device
              config_get block_auto_probe main block_auto_probe 0
          '''
          new = '''        config_load qmodem
              config_get block_auto_probe main block_auto_probe 0
              [ "$block_auto_probe" -eq 1 ] || _start_scand
              config_foreach _mk_rundir modem-device
          '''
          if old not in data:
              raise SystemExit('qmodem_init layout changed; refusing an unsafe patch')
          path.write_text(data.replace(old, new, 1))
          PY

          # The upstream stop order can leave a stopped shell behind after
          # concurrent ifup events.  Resume the daemon before asking procd to kill it.
          if [ "${{ matrix.profile }}" = full ]; then
            WRT_INIT="$(grep -Rsl 'kill -CONT.*PID_FILE' package/wrtbwmon 2>/dev/null | head -n1)"
            test -n "$WRT_INIT"
            sed -i '/procd_kill wrtbwmon/{N;s/procd_kill wrtbwmon\n[[:space:]]*kill -CONT \$(cat \$PID_FILE)/kill -CONT \$(cat \$PID_FILE) 2>\/dev\/null || true\n\tprocd_kill wrtbwmon/;}' "$WRT_INIT"
          fi

          # Final defaults run after QModem's own defaults.  Keep the fixed modem
          # profile deterministic and set the documented RAM-image root password.
          mkdir -p package/base-files/files/etc/uci-defaults
          cat > package/base-files/files/etc/uci-defaults/zzz-h5000m-finalize <<'EOF'
          #!/bin/sh
          [ "$(cat /tmp/sysinfo/board_name 2>/dev/null)" = "hiveton,h5000m" ] || exit 0
          uci set qmodem.main.block_auto_probe='1'
          uci set qmodem.main.start_delay='0'
          uci set qmodem.main.try_preset_usb='0'
          uci set qmodem.main.try_preset_pcie='0'
          uci commit qmodem
          printf 'admin\nadmin\n' | passwd root >/dev/null 2>&1
          exit 0
          EOF

          if [ "${{ matrix.profile }}" = full ]; then
            # HigoROS 1.26 detects the legacy OAF control surface.  OAF 7 uses
            # /etc/config/fwx, so provide a narrow compatibility configuration and
            # reload shim while retaining the new kernel module and daemon.
            mkdir -p package/base-files/files/etc/config package/base-files/files/usr/bin
            cat > package/base-files/files/etc/config/appfilter <<'EOF'
          config global 'global'
                  option enable '1'
                  option work_mode '0'
                  option record_enable '1'
                  option disable_hnat '0'
                  option tcp_rst '1'
                  option lan_ifname 'br-lan'
                  option auto_load_engine '1'
                  option disable_quic '0'
                  option user_mode '0'
                  option app_filter_mode '0'
          config appfilter 'appfilter'
          config feature 'feature'
                  option update '0'
                  option format 'v3.0'
          config rule 'rule'
          EOF
            cat > package/base-files/files/usr/bin/oaf_rule <<'EOF'
          #!/bin/sh
          case "$1" in
            reload)
              enabled="$(uci -q get appfilter.global.enable)"
              uci -q set fwx.appfilter.enable="${enabled:-1}"
              uci -q commit fwx
              /etc/init.d/appfilter reload
              ;;
            *) exit 0 ;;
          esac
          EOF
            chmod 0755 package/base-files/files/usr/bin/oaf_rule
          fi

      - name: Enable Quectel QMAP stack
        run: |
          sed -i '/CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=/d' .config
          cat >> .config <<'EOF'
          # CONFIG_PACKAGE_kmod-usb-net-qmi-wwan is not set
          CONFIG_PACKAGE_kmod-qmi_wwan_q=y
          CONFIG_PACKAGE_qmodem=y
          CONFIG_PACKAGE_luci-app-qmodem-next=y
          CONFIG_PACKAGE_luci-i18n-qmodem-next-zh-cn=y
          EOF

          if [ "${{ matrix.profile }}" = full ]; then
            cat >> .config <<'EOF'
          # Restore packages used by Higo feature detection and vendor menus.
          CONFIG_PACKAGE_wrtbwmon=y
          CONFIG_PACKAGE_luci-app-wrtbwmon=y
          CONFIG_PACKAGE_luci-i18n-wrtbwmon-zh-cn=y
          CONFIG_PACKAGE_kmod-hwmon-pwmfan=y
          CONFIG_PACKAGE_fancontrol=y
          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_automount=y
          CONFIG_PACKAGE_mount-utils=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-extras=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_exfat-fsck=y
          CONFIG_PACKAGE_exfat-mkfs=y
          CONFIG_PACKAGE_ntfs3-mount=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-i18n-diskman-zh-cn=y
          CONFIG_PACKAGE_kmod-fs-ksmbd=y
          CONFIG_PACKAGE_ksmbd-server=y
          CONFIG_PACKAGE_luci-app-ksmbd=y
          CONFIG_PACKAGE_luci-i18n-ksmbd-zh-cn=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_ddns-scripts-services=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_watchcat=y
          CONFIG_PACKAGE_luci-app-watchcat=y
          CONFIG_PACKAGE_luci-i18n-watchcat-zh-cn=y
          CONFIG_PACKAGE_zerotier=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_luci-i18n-zerotier-zh-cn=y
          EOF
          fi

      - name: Configure
        run: |
          make defconfig
          ./scripts/diffconfig.sh
          grep -E 'qmi_wwan|qmodem|higoros|app-oaf|fancontrol|wrtbwmon|diskman|ksmbd|upnp|ddns|watchcat|zerotier' .config || true
          required='higoros qmodem'
          [ "${{ matrix.profile }}" = full ] && required="$required fancontrol appfilter wrtbwmon block-mount ksmbd-server miniupnpd-nftables ddns-scripts watchcat zerotier"
          for pkg in $required; do
            grep -q "CONFIG_PACKAGE_${pkg}=y" .config || { echo "Required package missing after defconfig: $pkg"; exit 1; }
          done
          df -h /

      - name: Download
        run: |
          make download -j8
          find dl -type f -size -1024c -delete
          df -h /

      - name: Build
        run: |
          make -j"$(nproc)" V=s
          df -h /

      - name: Collect images
        run: |
          mkdir -p artifacts
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*h5000m*' -o -name 'sha256sums' -o -name '*.manifest' \
            -o -name '*.buildinfo' \) -exec cp -v {} artifacts/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: h5000m-initramfs-${{ matrix.profile }}
          path: artifacts/
          if-no-files-found: error
