on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          ref: openwrt-25.12

      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo rm -rf /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker system prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Install minimal build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib gettext git libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libncurses-dev libreadline-dev libssl-dev libtool ninja-build p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Add QModem feed
        run: |
          echo 'src-git qmodem https://github.com/FUjr/QModem.git;main' >> feeds.conf.default

      - name: Apply private H5000M overlay
        run: |
          rm -rf /tmp/h5000m-overlay
          mkdir -p /tmp/h5000m-overlay package/hiveton
          unzip -q h5000m-25.12-build-overlay.zip -d /tmp/h5000m-overlay
          cp -a /tmp/h5000m-overlay/higoros package/hiveton/higoros
          cp /tmp/h5000m-overlay/h5000m-initramfs.config .config
          sed -i 's|PROG=/usr/sbin/higorosd|PROG=/usr/bin/higorosd|' package/hiveton/higoros/files/etc/init.d/higoros
          mkdir -p package/hiveton/higoros/files/etc/uci-defaults
          printf '%s' '' | base64 -d > package/hiveton/higoros/files/etc/uci-defaults/97-h5000m-wireless
          printf '%s' '' | base64 -d > package/hiveton/higoros/files/etc/uci-defaults/98-h5000m-network
          printf '%s' '' | base64 -d > package/hiveton/higoros/files/etc/uci-defaults/99-h5000m-qmodem
          printf '%s' '' | base64 -d > package/hiveton/higoros/Makefile
          rm -rf /tmp/h5000m-overlay

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Enable Quectel QMAP stack
        run: |
          sed -i '/CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=/d' .config
          cat >> .config <<'EOF'
          # CONFIG_PACKAGE_kmod-usb-net-qmi-wwan is not set
          CONFIG_PACKAGE_kmod-qmi_wwan_q=y
          CONFIG_PACKAGE_qmodem=y
          CONFIG_PACKAGE_luci-app-qmodem-next=y
          CONFIG_PACKAGE_luci-i18n-qmodem-next-zh-cn=y
          EOF

      - name: Configure
        run: |
          make defconfig
          ./scripts/diffconfig.sh
          grep -E 'qmi_wwan|qmodem|higoros' .config || true
          df -h /

      - name: Download
        run: |
          make download -j8
          find dl -type f -size -1024c -delete
          df -h /

      - name: Build
        run: |
          make -j"$(nproc)" V=s
          df -h /

      - name: Collect images
        run: |
          mkdir -p artifacts
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*h5000m*' -o -name 'sha256sums' -o -name '*.manifest' \
            -o -name '*.buildinfo' \) -exec cp -v {} artifacts/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: h5000m-initramfs-qmodem
          path: artifacts/
          if-no-files-found: error


