name: Build H5000M firmware
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: rescue
        type: choice
        options: [rescue, full, both]
      source:
        description: Source lock
        required: true
        default: candidate
        type: choice
        options: [candidate, stable]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      matrix:
        profile: ${{ fromJSON(inputs.profile == 'both' && '["rescue","full"]' || format('["{0}"]', inputs.profile)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
      - name: Build locked profile
        run: ./scripts/build.sh "${{ matrix.profile }}" "${{ inputs.source }}"
      - uses: actions/upload-artifact@v4
        with:
          name: h5000m-${{ matrix.profile }}-${{ inputs.source }}
          path: |
            workspace/immortalwrt/bin/targets/mediatek/filogic/*h5000m*
            BUILD-MANIFEST.json
          if-no-files-found: error
