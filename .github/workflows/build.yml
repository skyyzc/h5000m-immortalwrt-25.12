name: Build H5000M firmware
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: rescue
        type: choice
        options: [rescue, full, both]
      source:
        description: Source lock
        required: true
        default: candidate
        type: choice
        options: [candidate, stable]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      matrix:
        profile: ${{ fromJSON(inputs.profile == 'both' && '["rescue","full"]' || format('["{0}"]', inputs.profile)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libncurses-dev libreadline-dev libssl-dev libtool ninja-build p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev
      - name: Build locked profile
        env:
          JOBS: 4
        run: |
          mkdir -p artifacts
          set -o pipefail
          ./scripts/build.sh "${{ matrix.profile }}" "${{ inputs.source }}" 2>&1 | tee artifacts/build.log
      - name: Set artifact identity
        id: identity
        shell: bash
        run: |
          project_short=$(git rev-parse --short=8 HEAD)
          source_short=$(python3 -c 'import json; print(json.load(open("versions/${{ inputs.source }}.json"))["immortalwrt"]["commit"][:8])')
          echo "name=h5000m-${{ matrix.profile }}-${project_short}-${source_short}-run${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.name }}
          path: artifacts/**
          if-no-files-found: error
